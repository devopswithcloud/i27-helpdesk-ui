name: UI CICD
run-name: Deploy to ${{ inputs.environment || 'dev' }} | by ${{ github.actor}} | branch ${{ github.ref_name}}
on: 
  push:
    branches: [master]
    paths:
    - 'src/**'
    - 'package.json'
    - 'next.config.js'
    - 'Dockerfile'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod 
        default: dev 
env:
  IMAGE_NAME: devopswithcloudhub/i27helpdesk-ui
  GCP_PROJECT_ID: project-297df0e3-3d6b-40a7-aab
  GKE_CLUSTER: i27helpdesk-cluster
  GKE_ZONE: us-east4-a
jobs:
  # ------------------------ Job 1 : Build and Test ------------------------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
  # ------------------------ Job 2 : Docker Build and Push ------------------------
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    environment: 
      name: ${{ inputs.environment || 'dev'}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Image Tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
            context: .
            push: true
            build-args: |
                NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            tags: |
                ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}